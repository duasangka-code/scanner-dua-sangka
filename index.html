
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner QR - Dua Sangka</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 450px;
      margin: 30px auto;
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 3px 15px #0001;
    }

    h2 { letter-spacing: 2px; }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    #hasil {
      margin: 18px 0;
      padding: 15px;
      border-radius: 8px;
      background: #eee;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    button {
      width: 100%;
      padding: 15px;
      background: #222;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>DUA SANGKA</h2>
    <p>Scanner QR Pengambilan Pesanan</p>

    <div id="reader"></div>

    <div id="hasil">
      Tekan tombol untuk mengaktifkan kamera.
    </div>

  <button id="tombolScan"
  type="button"
  onclick="document.getElementById('hasil').innerText='TOMBOL BERHASIL DITEKAN';">
  AKTIFKAN KAMERA
</button>

  <script>
    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbzaSrZMqmB1xfLbsQky48Qwo5qCA-WAxh0b6BZRLJhgbS37UvXp-R1KqkbAcS_tG1UQbA/exec";

    let scanner = null;
    let sedangMemproses = false;

    function tampilkanHasil(pesan) {
      document.getElementById("hasil").innerText = pesan;
    }

  
function mulaiScanner() {
  const tombol = document.getElementById("tombolScan");

  if (!window.Html5Qrcode) {
    tampilkanHasil("Library scanner gagal dimuat. Periksa internet.");
    return;
  }

  if (scanner) {
    tampilkanHasil("Scanner sedang berjalan. Muat ulang halaman jika perlu.");
    return;
  }

  tombol.disabled = true;
  tampilkanHasil("Mencari kamera iPhone...");

  Html5Qrcode.getCameras()
    .then(function(kameras) {
      if (!kameras || kameras.length === 0) {
        throw new Error("Kamera tidak ditemukan. Periksa kamera iPhone.");
      }

      // Utamakan kamera belakang
      const kameraBelakang = kameras.find(function(kamera) {
        return /back|rear|environment|belakang/i.test(kamera.label);
      });

      const kameraDipilih = kameraBelakang || kameras[0];

      scanner = new Html5Qrcode("reader");

      tampilkanHasil("Mengaktifkan kamera: " + kameraDipilih.label);

      return scanner.start(
        kameraDipilih.id,
        { fps: 10, qrbox: 250 },

        function(token) {
          if (sedangMemproses) return;
          sedangMemproses = true;

          tampilkanHasil("QR terbaca. Memeriksa pesanan...");

          scanner.stop().then(function() {
            scanner = null;
            verifikasiToken(token);
          }).catch(function(error) {
            tampilkanHasil("Gagal menghentikan kamera: " + error);
            tombol.disabled = false;
            sedangMemproses = false;
            scanner = null;
          });
        }
      );
    })
    .then(function() {
      tampilkanHasil("Kamera aktif. Arahkan ke QR pelanggan.");
      tombol.innerText = "KAMERA AKTIF";
    })
    .catch(function(error) {
      tampilkanHasil("Kamera gagal dibuka: " + error.message);
      tombol.disabled = false;
      tombol.innerText = "COBA LAGI";
      scanner = null;
      sedangMemproses = false;
    });
}

        function(token) {
  if (sedangMemproses) return;
  sedangMemproses = true;

 tampilkanHasil("QR terbaca. Isi QR: " + token);

setTimeout(function() {
  scanner.stop().then(function() {
            tampilkanHasil("QR terbaca. Memeriksa pesanan...");
            scanner = null;
            verifikasiToken(token);
            }).catch(function(error) {
    tampilkanHasil("Gagal menghentikan kamera: " + error);
    tombol.disabled = false;
    sedangMemproses = false;
  });
}, 2000);
        }
      ).then(function() {
        tampilkanHasil("Kamera aktif. Arahkan ke QR pelanggan.");
        tombol.innerText = "KAMERA AKTIF";
      }).catch(function(error) {
        tampilkanHasil("Kamera gagal dibuka: " + error);
        tombol.disabled = false;
        scanner = null;
      });
    }

    function verifikasiToken(token) {
      const callback = "hasilVerifikasiDuaSangka_" + Date.now();
      const script = document.createElement("script");
      const tombol = document.getElementById("tombolScan");

      let selesai = false;
      let batasWaktu;

      function bersihkan() {
        selesai = true;
        clearTimeout(batasWaktu);
        delete window[callback];
        script.remove();
      }

      batasWaktu = setTimeout(function() {
        if (selesai) return;

        tampilkanHasil("Server terlalu lama merespons. Silakan coba lagi.");
        bersihkan();
        tombol.disabled = false;
        tombol.innerText = "SCAN BERIKUTNYA";
        sedangMemproses = false;
      }, 20000);

      window[callback] = function(res) {
        if (selesai) return;

        tampilkanHasil(res.pesan || "Pemeriksaan selesai.");
        bersihkan();
        tombol.disabled = false;
        tombol.innerText = "SCAN BERIKUTNYA";
        sedangMemproses = false;
      };

      script.async = true;
script.onload = function() {
  if (selesai) return;

  tampilkanHasil("Skrip berhasil dimuat, tetapi callback tidak dijalankan.");
};
      script.onerror = function() {
        if (selesai) return;

       tampilkanHasil("Koneksi JSONP gagal. Periksa pemuatan skrip Apps Script.");
        bersihkan();
        tombol.disabled = false;
        tombol.innerText = "SCAN BERIKUTNYA";
        sedangMemproses = false;
      };

      script.src =
        URL_APPS_SCRIPT +
        "?api=verifikasi" +
        "&token=" + encodeURIComponent(token) +
        "&callback=" + callback +
        "&_=" + Date.now();

      document.body.appendChild(script);
    }
  </script>
</body>
</html>
