
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner QR - Dua Sangka</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 450px;
      margin: 30px auto;
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 3px 15px #0001;
    }

    h2 { letter-spacing: 2px; }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    #hasil {
      margin: 18px 0;
      padding: 15px;
      border-radius: 8px;
      background: #eee;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    button {
      width: 100%;
      padding: 15px;
      background: #222;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>DUA SANGKA</h2>
    <p>Scanner QR Pengambilan Pesanan</p>

    <div id="reader"></div>

    <div id="hasil">
      Tekan tombol untuk mengaktifkan kamera.
    </div>

    <button id="tombolScan" type="button" onclick="mulaiScanner()">
      AKTIFKAN KAMERA
    </button>
  </div>

  <script>
    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbzaSrZMqmB1xfLbsQky48Qwo5qCA-WAxh0b6BZRLJhgbS37UvXp-R1KqkbAcS_tG1UQbA/exec";

    let scanner = null;
    let sedangMemproses = false;

    function tampilkanHasil(pesan) {
      document.getElementById("hasil").innerText = pesan;
    }

    function mulaiScanner() {
      const tombol = document.getElementById("tombolScan");

      if (!window.Html5Qrcode) {
        tampilkanHasil("Library scanner gagal dimuat. Periksa koneksi internet.");
        return;
      }

      if (scanner) {
        tampilkanHasil("Scanner masih berjalan.");
        return;
      }

      tombol.disabled = true;
      tampilkanHasil("Meminta akses kamera...");

      Html5Qrcode.getCameras()
        .then(function(kameras) {
          if (!kameras || kameras.length === 0) {
            throw new Error("Kamera tidak ditemukan.");
          }

          const kameraBelakang = kameras.find(function(kamera) {
            return /back|rear|environment|belakang/i.test(kamera.label);
          });

          const kameraDipilih = kameraBelakang || kameras[0];

          scanner = new Html5Qrcode("reader");

          tampilkanHasil("Mengaktifkan kamera...");

          return scanner.start(
            kameraDipilih.id,
            { fps: 10, qrbox: 250 },
            function(token) {
              if (sedangMemproses) return;

              sedangMemproses = true;
              tombol.disabled = true;

              tampilkanHasil("QR terbaca. Memeriksa pesanan...");

              const scannerAktif = scanner;

              scannerAktif.stop()
                .catch(function() {
                  // Lanjutkan pemeriksaan token.
                })
                .then(function() {
                  scanner = null;
                  verifikasiToken(token);
                });
            }
          );
        })
        .then(function() {
          tampilkanHasil("Kamera aktif. Arahkan ke QR pelanggan.");
          tombol.innerText = "KAMERA AKTIF";
        })
        .catch(function(error) {
          tampilkanHasil(
            "Kamera gagal dibuka: " +
            (error.message || error)
          );

          if (scanner) {
            scanner.clear().catch(function() {});
          }

          scanner = null;
          tombol.disabled = false;
          tombol.innerText = "COBA LAGI";
          sedangMemproses = false;
        });
    }

    function verifikasiToken(token) {
      const callback = "hasilVerifikasiDuaSangka_" + Date.now();
      const script = document.createElement("script");
      const tombol = document.getElementById("tombolScan");

      let selesai = false;
      let batasWaktu;

      tombol.disabled = true;
      tampilkanHasil("Menghubungi server Dua Sangka...");

      function bersihkan() {
        selesai = true;
        clearTimeout(batasWaktu);
        delete window[callback];
        script.remove();
      }

      batasWaktu = setTimeout(function() {
        if (selesai) return;

        bersihkan();
        tampilkanHasil("Server terlalu lama merespons. Silakan coba lagi.");
        tombol.disabled = false;
        tombol.innerText = "SCAN BERIKUTNYA";
        sedangMemproses = false;
      }, 20000);

      window[callback] = function(res) {
        if (selesai) return;

        bersihkan();

        tampilkanHasil(
          res && res.pesan
            ? res.pesan
            : "Server memberikan respons yang tidak dikenal."
        );

        tombol.disabled = false;
        tombol.innerText = "SCAN BERIKUTNYA";
        sedangMemproses = false;
      };

      script.onerror = function() {
        if (selesai) return;

        bersihkan();
        tampilkanHasil("Koneksi ke server gagal. Periksa koneksi internet.");
        tombol.disabled = false;
        tombol.innerText = "SCAN BERIKUTNYA";
        sedangMemproses = false;
      };

      script.src =
        URL_APPS_SCRIPT +
        "?api=verifikasi" +
        "&token=" + encodeURIComponent(token) +
        "&callback=" + callback +
        "&_=" + Date.now();

      document.body.appendChild(script);
    }
  </script>
</body>
</html>
